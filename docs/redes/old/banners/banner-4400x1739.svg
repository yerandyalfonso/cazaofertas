<svg xmlns="http://www.w3.org/2000/svg" width="4400" height="1739" viewBox="0 0 4400 1739">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#FFB21A"/>
      <stop offset="0.6" stop-color="#F98A16"/>
      <stop offset="1" stop-color="#E5640C"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDD0A"/>
      <stop offset="1" stop-color="#F9992B"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="5" fill="#92400E" fill-opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="60" stdDeviation="0" flood-color="#F48521"/>
    </filter>
    <filter id="title" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="0" flood-color="#C2410C"/>
      <feDropShadow dx="0" dy="60" stdDeviation="40" flood-color="#7C2D12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="4400" height="1739" fill="url(#bg)"/>
  <!-- decoración solo en los laterales (zona que Facebook recorta en móvil) -->
  <rect x="-120" y="120" width="460" height="460" rx="60" transform="rotate(-24 110 350)" fill="url(#tile)" filter="url(#soft)"/>
  <rect x="4080" y="1180" width="460" height="460" rx="60" transform="rotate(-24 4310 1410)" fill="url(#tile)" filter="url(#soft)"/>
  <rect x="120" y="1080" width="420" height="420" fill="url(#dots)"/>
  <rect x="3880" y="160" width="380" height="380" fill="url(#dots)"/>
  <g fill="#fff" fill-opacity="0.35" font-family="DM Sans" font-weight="900" font-size="150">
    <text x="520" y="1500">%</text><text x="3780" y="760">%</text>
  </g>
  <!-- contenido en la franja segura central (x 760–3640) -->
  <g text-anchor="middle" font-family="DM Sans">
    <text x="2200" y="900" font-size="370" font-weight="900" letter-spacing="-10" fill="#FFF7E8" stroke="#C2410C" stroke-width="10" paint-order="stroke" filter="url(#title)">Chollos de Hoy</text>
    <text x="2200" y="1130" font-size="120" font-weight="700" fill="#5A1E06">Bajadas de precio reales, comprobadas cada día</text>
    <rect x="1640" y="1230" width="1120" height="150" rx="75" fill="#FFF7E8"/>
    <text x="2200" y="1330" font-size="84" font-weight="800" fill="#B45309">chollosdhoy.com</text>
  </g>
</svg>
