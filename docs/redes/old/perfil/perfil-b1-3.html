<!doctype html>
<!--
  Foto de perfil «chollos d'hoy» con el icono B1-3 (1080×1080; Facebook/Instagram/Telegram la recortan en círculo).
  #a: icono negro sobre el naranja del banner · #b: icono a sangre (fondo negro).
-->
<html><head><meta charset="utf-8"><style>
  body{margin:0} .p{width:1080px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .a{background:radial-gradient(70% 70% at 48% 40%,#FFB000 0%,#FDA015 60%,#F7861A 100%)}
  .a img{width:600px;height:600px;filter:drop-shadow(18px 36px 40px rgba(154,61,0,.45))}
  .b{background:#0B0B0C}
  .b img{width:820px;height:820px}
</style></head><body>
<div class="p a" id="a"><img src="svg/b1-3-icono.svg"></div>
<div class="p b" id="b"><img src="svg/b1-3-icono.svg"></div>
</body></html>
