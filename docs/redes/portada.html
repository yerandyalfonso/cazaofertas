<html><head><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0}.c{width:1640px;height:624px;background:linear-gradient(115deg,#fff4e0 0%,#faf7f4 45%,#f6efe8 100%);font-family:'DM Sans';position:relative;overflow:hidden;color:#1c1917}
.blob{position:absolute;right:-300px;top:-170px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fb923c,#f97316 45%,#c2410c)}
.card{position:absolute;right:300px;top:160px;width:300px;background:#fff;border-radius:28px;box-shadow:0 30px 60px rgba(146,64,14,.25);padding:28px 30px;transform:rotate(4deg)}
.card .b{display:inline-block;background:#f97316;color:#fff;font-weight:800;font-size:26px;padding:6px 14px;border-radius:999px}
.card .p{font-weight:900;font-size:64px;margin-top:14px;letter-spacing:-2px}
.card .s{color:#6f6259;font-size:24px;text-decoration:line-through}
.card .l{margin-top:12px;font-size:20px;color:#6f6259}
.txt{position:absolute;left:290px;top:170px;width:640px}
h1{margin:0;font-weight:900;font-size:88px;letter-spacing:-3px;line-height:.95}
h1 em{font-style:normal;color:#c2410c}
p{margin:22px 0 0;font-size:30px;font-weight:500;line-height:1.3;color:#3d3530}
.pill{margin-top:28px;display:inline-block;font-weight:700;font-size:23px;color:#92400e;background:#fff;border:2px solid #f6c89a;border-radius:999px;padding:10px 22px}</style></head>
<body><div class="c"><div class="blob"></div>
<div class="txt"><h1>Chollos <em>de Hoy</em></h1><p>Bajadas de precio reales en Amazon, MediaMarkt, PcComponentes y más.</p><div class="pill">chollosdhoy.com · precios comprobados a diario</div></div>
<div class="card"><span class="b">−32 %</span><div class="p">94,95 €</div><div class="s">140,26 €</div><div class="l">mínimo de los últimos 30 días</div></div>
</div></body></html>
